name: Verify distribution
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: '8.15.0'
      - run: bash scripts/setup.sh
      - run: pnpm test
      - run: python3 -m unittest discover -s factory -p 'test_*.py'
      - run: pnpm run verify:portable
